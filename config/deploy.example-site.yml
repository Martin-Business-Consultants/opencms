# One site's install, as a Kamal destination over config/deploy.yml.
# Copy to config/deploy.<site>.yml, and .kamal/secrets.example-site to
# .kamal/secrets.<site> (neither is committed), then:
#
#   kamal setup -d <site>
#   kamal deploy -d <site>
#
# Several sites can share a server: each has its own service name, host and
# volume.
service: cms-example-site

servers:
  web:
    - 203.0.113.10

env:
  clear:
    APP_HOST: example-site.example.com
    # What the API sends as `tenant`, and what Lumin matches a site on.
    # Defaults to the first label of APP_HOST; keep it if the host changes.
    SITE_KEY: example-site
    # Behind a proxy that terminates TLS (Cloudflare, a load balancer).
    # ASSUME_SSL: "true"
  # The site's secrets (.kamal/secrets.example-site). A site moved from the
  # old shared install lists only SECRET_KEY_BASE, set to the old install's,
  # since its encrypted values were written with keys derived from it.
  secret:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
    # - SMTP_PASSWORD
    # Lets Settings › Updates start the Deploy workflow (docs/install.md).
    # - CMS_GITHUB_TOKEN

proxy:
  host: example-site.example.com
  # kamal-proxy gets a Let's Encrypt certificate itself; false behind Cloudflare.
  ssl: true

volumes:
  - "cms_example_site_storage:/rails/storage"
