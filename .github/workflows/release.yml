# Publishes a release when a version tag is pushed (bin/release does both),
# with that version's CHANGELOG.md section as its notes. Every install's daily
# check then sees it, and Settings › Updates offers it to the owner.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version). Cut releases with bin/release."
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no ## $version section"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md --title "CMS ${GITHUB_REF_NAME#v}"
