key: home_services
version: 1
name: Home services (general)
description: Roofing, electrical, cleaning, landscaping and the like — service-area trades not covered by a more specific template.
category: Contractor
schema_type: HomeAndConstructionBusiness
footprint: service_area
services: [contractor, roofing, electrician, house cleaning, landscaping, pest control, painting, handyman]
keyword_patterns: ["{service} {city}", "{service} near me", "{modifier} {service} {city}"]
modifiers: [licensed, affordable, best]
directories: [angi.com, homeadvisor.com, thumbtack.com, houzz.com, nextdoor.com]
reports:
  - {kind: site_audit, cadence: weekly}
  - {kind: business_profile, cadence: weekly}
  - {kind: google_reviews, cadence: weekly}
  - {kind: local_rankings, cadence: weekly}
  - {kind: rank_map, cadence: weekly}
  - {kind: ranked_keywords, cadence: weekly}
  - {kind: keyword_opportunities, cadence: monthly}
  - {kind: citations, cadence: monthly}
  - {kind: page_health, cadence: weekly}
  - {kind: ai_answers, cadence: weekly}
agents: [reporting_analyst, content_gap, metadata_optimizer, technical_seo]
targets: {map_pack_share: 40, rating: 4.7, reviews: 100, top_3: 15, page_score: 85, ai_mention_rate: 20, citations_consistent: 11}
content_scaffold:
  - {slug: services, title: Our services, kind: services}
  - {slug: service-area, title: Areas we serve, kind: location}
  - {slug: reviews, title: Reviews, kind: reviews}
